<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#84fab0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8fd3f4;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="connectionGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.2" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#skyGradient)" rx="20"/>
  
  <!-- City Buildings -->
  <!-- Building 1 -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="40" height="120" fill="url(#buildingGradient1)" rx="4"/>
    <!-- Windows -->
    <rect x="5" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="15" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="27" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="5" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="15" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="27" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="5" y="40" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="15" y="40" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="27" y="40" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <!-- Smart sensors -->
    <circle cx="35" cy="5" r="3" fill="#22c55e"/>
    <circle cx="35" cy="5" r="6" fill="url(#connectionGradient)"/>
  </g>
  
  <!-- Building 2 (Tallest) -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="50" height="160" fill="url(#buildingGradient2)" rx="4"/>
    <!-- Windows -->
    <rect x="5" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="18" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="31" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="5" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="18" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="31" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="5" y="40" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="18" y="40" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="31" y="40" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="5" y="55" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="18" y="55" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="31" y="55" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <!-- Smart sensors -->
    <circle cx="45" cy="5" r="3" fill="#22c55e"/>
    <circle cx="45" cy="5" r="8" fill="url(#connectionGradient)"/>
  </g>
  
  <!-- Building 3 -->
  <g transform="translate(160, 100)">
    <rect x="0" y="0" width="45" height="140" fill="url(#buildingGradient3)" rx="4"/>
    <!-- Windows -->
    <rect x="5" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="17" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="29" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="5" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="17" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="29" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="5" y="40" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="17" y="40" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="29" y="40" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <!-- Smart sensors -->
    <circle cx="40" cy="5" r="3" fill="#22c55e"/>
    <circle cx="40" cy="5" r="7" fill="url(#connectionGradient)"/>
  </g>
  
  <!-- Building 4 -->
  <g transform="translate(215, 130)">
    <rect x="0" y="0" width="35" height="110" fill="url(#buildingGradient1)" rx="4"/>
    <!-- Windows -->
    <rect x="5" y="10" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <rect x="15" y="10" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <rect x="24" y="10" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <rect x="5" y="22" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <rect x="15" y="22" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <rect x="24" y="22" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <!-- Smart sensors -->
    <circle cx="30" cy="5" r="3" fill="#22c55e"/>
    <circle cx="30" cy="5" r="6" fill="url(#connectionGradient)"/>
  </g>
  
  <!-- Building 5 -->
  <g transform="translate(260, 110)">
    <rect x="0" y="0" width="40" height="130" fill="url(#buildingGradient2)" rx="4"/>
    <!-- Windows -->
    <rect x="5" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="16" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="27" y="10" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="5" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="16" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <rect x="27" y="25" width="8" height="8" fill="white" opacity="0.8" rx="1"/>
    <!-- Smart sensors -->
    <circle cx="35" cy="5" r="3" fill="#22c55e"/>
    <circle cx="35" cy="5" r="7" fill="url(#connectionGradient)"/>
  </g>
  
  <!-- Building 6 -->
  <g transform="translate(310, 140)">
    <rect x="0" y="0" width="30" height="100" fill="url(#buildingGradient3)" rx="4"/>
    <!-- Windows -->
    <rect x="5" y="10" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <rect x="14" y="10" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <rect x="22" y="10" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <rect x="5" y="20" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <rect x="14" y="20" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <rect x="22" y="20" width="6" height="6" fill="white" opacity="0.8" rx="1"/>
    <!-- Smart sensors -->
    <circle cx="25" cy="5" r="3" fill="#22c55e"/>
    <circle cx="25" cy="5" r="6" fill="url(#connectionGradient)"/>
  </g>
  
  <!-- Connection Lines -->
  <g stroke="#22c55e" stroke-width="2" stroke-opacity="0.6" fill="none">
    <path d="M85 125 Q100 115 145 85" stroke-dasharray="5,5"/>
    <path d="M145 85 Q160 95 205 105" stroke-dasharray="5,5"/>
    <path d="M205 105 Q220 120 245 135" stroke-dasharray="5,5"/>
    <path d="M245 135 Q270 125 295 115" stroke-dasharray="5,5"/>
    <path d="M295 115 Q310 130 335 145" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Smart City Elements -->
  <!-- Traffic Light -->
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="8" height="20" fill="#374151" rx="2"/>
    <circle cx="4" cy="5" r="2" fill="#ef4444"/>
    <circle cx="4" cy="10" r="2" fill="#f59e0b"/>
    <circle cx="4" cy="15" r="2" fill="#22c55e" opacity="0.8"/>
    <circle cx="4" cy="15" r="4" fill="url(#connectionGradient)"/>
  </g>
  
  <!-- Smart Car -->
  <g transform="translate(350, 220)">
    <rect x="0" y="0" width="25" height="12" fill="#3b82f6" rx="6"/>
    <circle cx="6" cy="12" r="3" fill="#1f2937"/>
    <circle cx="19" cy="12" r="3" fill="#1f2937"/>
    <circle cx="12" cy="6" r="2" fill="#22c55e"/>
    <circle cx="12" cy="6" r="4" fill="url(#connectionGradient)"/>
  </g>
  
  <!-- Weather Station -->
  <g transform="translate(200, 50)">
    <rect x="0" y="0" width="4" height="15" fill="#6b7280"/>
    <circle cx="2" cy="0" r="3" fill="#22c55e"/>
    <circle cx="2" cy="0" r="6" fill="url(#connectionGradient)"/>
    <path d="M-3 -8 L7 -8 M-1 -6 L5 -6 M1 -4 L3 -4" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Data Dashboard -->
  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="80" height="50" fill="white" opacity="0.1" rx="6"/>
    <text x="40" y="15" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Smart City Dashboard</text>
    <text x="10" y="28" fill="white" font-size="8">Traffic: 🟢 Normal</text>
    <text x="10" y="38" fill="white" font-size="8">Air Quality: 🟡 Moderate</text>
    <text x="10" y="48" fill="white" font-size="8">Energy: 🟢 Efficient</text>
  </g>
  
  <!-- IoT Sensors Floating -->
  <g transform="translate(120, 200)">
    <circle cx="0" cy="0" r="3" fill="#22c55e"/>
    <circle cx="0" cy="0" r="6" fill="url(#connectionGradient)"/>
    <text x="0" y="15" text-anchor="middle" fill="white" font-size="7">Noise</text>
  </g>
  
  <g transform="translate(180, 210)">
    <circle cx="0" cy="0" r="3" fill="#22c55e"/>
    <circle cx="0" cy="0" r="6" fill="url(#connectionGradient)"/>
    <text x="0" y="15" text-anchor="middle" fill="white" font-size="7">Air</text>
  </g>
  
  <g transform="translate(280, 200)">
    <circle cx="0" cy="0" r="3" fill="#22c55e"/>
    <circle cx="0" cy="0" r="6" fill="url(#connectionGradient)"/>
    <text x="0" y="15" text-anchor="middle" fill="white" font-size="7">Energy</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Smart City IoT Platform</text>
</svg>