<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="8"/>
  
  <!-- Icon Container -->
  <circle cx="200" cy="120" r="50" fill="url(#icon)" opacity="0.1"/>
  <circle cx="200" cy="120" r="40" fill="url(#icon)" opacity="0.2"/>
  
  <!-- Portfolio Icon -->
  <g transform="translate(180, 100)">
    <!-- Briefcase -->
    <rect x="0" y="8" width="40" height="24" rx="2" fill="url(#icon)" opacity="0.8"/>
    <rect x="8" y="4" width="24" height="8" rx="2" fill="url(#icon)" opacity="0.6"/>
    
    <!-- Lines representing content -->
    <rect x="8" y="12" width="24" height="2" fill="white" opacity="0.7"/>
    <rect x="8" y="16" width="20" height="2" fill="white" opacity="0.7"/>
    <rect x="8" y="20" width="16" height="2" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="16" fill="#6c757d" text-anchor="middle" font-weight="500">
    Portfolio Görseli
  </text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="14" fill="#adb5bd" text-anchor="middle">
    Yükleniyor...
  </text>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="80" r="3" fill="url(#icon)" opacity="0.3"/>
  <circle cx="320" cy="60" r="4" fill="url(#icon)" opacity="0.3"/>
  <circle cx="60" cy="220" r="2" fill="url(#icon)" opacity="0.3"/>
  <circle cx="340" cy="240" r="3" fill="url(#icon)" opacity="0.3"/>
</svg>
