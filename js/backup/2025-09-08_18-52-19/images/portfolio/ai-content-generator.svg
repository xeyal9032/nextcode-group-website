<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#aiGradient)" rx="20"/>
  
  <!-- Brain/AI Icon -->
  <g transform="translate(50, 50)">
    <circle cx="50" cy="50" r="45" fill="url(#brainGradient)" opacity="0.9"/>
    <path d="M25 35 Q35 25 45 35 Q55 25 65 35 Q75 45 65 55 Q55 65 45 55 Q35 65 25 55 Q15 45 25 35" fill="white" opacity="0.8"/>
    <circle cx="35" cy="45" r="3" fill="#667eea"/>
    <circle cx="55" cy="45" r="3" fill="#667eea"/>
    <path d="M30 55 Q45 65 60 55" stroke="#667eea" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Document/Content Icons -->
  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="120" height="80" fill="white" opacity="0.9" rx="8"/>
    <rect x="10" y="10" width="100" height="4" fill="#667eea" opacity="0.7"/>
    <rect x="10" y="20" width="80" height="4" fill="#667eea" opacity="0.5"/>
    <rect x="10" y="30" width="90" height="4" fill="#667eea" opacity="0.5"/>
    <rect x="10" y="40" width="70" height="4" fill="#667eea" opacity="0.5"/>
    <rect x="10" y="50" width="85" height="4" fill="#667eea" opacity="0.5"/>
    <rect x="10" y="60" width="75" height="4" fill="#667eea" opacity="0.5"/>
  </g>
  
  <!-- Connection Lines -->
  <path d="M120 90 Q160 90 200 90" stroke="white" stroke-width="3" fill="none" opacity="0.8"/>
  <circle cx="140" r="4" cy="90" fill="white" opacity="0.8"/>
  <circle cx="160" r="4" cy="90" fill="white" opacity="0.8"/>
  <circle cx="180" r="4" cy="90" fill="white" opacity="0.8"/>
  
  <!-- Magic Sparkles -->
  <g transform="translate(150, 180)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="white" opacity="0.9"/>
  </g>
  <g transform="translate(280, 40)">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="white" opacity="0.7"/>
  </g>
  <g transform="translate(320, 180)">
    <path d="M0 -5 L1 -1 L5 0 L1 1 L0 5 L-1 1 L-5 0 L-1 -1 Z" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">AI Content Generator</text>
  <text x="200" y="270" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" opacity="0.8">Powered by Machine Learning</text>
</svg>