<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cryptoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bitcoinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7931e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ethereumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#627eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3c4cdd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#cryptoGradient)" rx="20"/>
  
  <!-- Header -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="300" height="40" fill="white" opacity="0.1" rx="8"/>
    <text x="150" y="25" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Crypto Portfolio Tracker</text>
  </g>
  
  <!-- Bitcoin Card -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="100" height="80" fill="white" opacity="0.9" rx="8"/>
    <circle cx="25" cy="25" r="15" fill="url(#bitcoinGradient)"/>
    <text x="25" y="30" text-anchor="middle" fill="white" font-size="12" font-weight="bold">₿</text>
    <text x="50" y="20" fill="#333" font-size="12" font-weight="bold">Bitcoin</text>
    <text x="50" y="35" fill="#666" font-size="10">BTC</text>
    <text x="50" y="50" fill="#22c55e" font-size="14" font-weight="bold">$45,230</text>
    <text x="50" y="65" fill="#22c55e" font-size="10">+2.5%</text>
  </g>
  
  <!-- Ethereum Card -->
  <g transform="translate(150, 80)">
    <rect x="0" y="0" width="100" height="80" fill="white" opacity="0.9" rx="8"/>
    <circle cx="25" cy="25" r="15" fill="url(#ethereumGradient)"/>
    <text x="25" y="30" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Ξ</text>
    <text x="50" y="20" fill="#333" font-size="12" font-weight="bold">Ethereum</text>
    <text x="50" y="35" fill="#666" font-size="10">ETH</text>
    <text x="50" y="50" fill="#22c55e" font-size="14" font-weight="bold">$3,120</text>
    <text x="50" y="65" fill="#22c55e" font-size="10">+1.8%</text>
  </g>
  
  <!-- Cardano Card -->
  <g transform="translate(270, 80)">
    <rect x="0" y="0" width="100" height="80" fill="white" opacity="0.9" rx="8"/>
    <circle cx="25" cy="25" r="15" fill="#0033ad"/>
    <text x="25" y="30" text-anchor="middle" fill="white" font-size="12" font-weight="bold">₳</text>
    <text x="50" y="20" fill="#333" font-size="12" font-weight="bold">Cardano</text>
    <text x="50" y="35" fill="#666" font-size="10">ADA</text>
    <text x="50" y="50" fill="#ef4444" font-size="14" font-weight="bold">$0.52</text>
    <text x="50" y="65" fill="#ef4444" font-size="10">-0.8%</text>
  </g>
  
  <!-- Chart Area -->
  <g transform="translate(30, 180)">
    <rect x="0" y="0" width="340" height="80" fill="white" opacity="0.1" rx="8"/>
    <text x="170" y="15" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Portfolio Performance (24h)</text>
    
    <!-- Chart Grid -->
    <g stroke="white" stroke-opacity="0.2" stroke-width="1">
      <line x1="20" y1="25" x2="320" y2="25"/>
      <line x1="20" y1="40" x2="320" y2="40"/>
      <line x1="20" y1="55" x2="320" y2="55"/>
      <line x1="20" y1="70" x2="320" y2="70"/>
    </g>
    
    <!-- Chart Line -->
    <polyline points="20,60 40,55 60,50 80,45 100,40 120,35 140,38 160,33 180,30 200,28 220,25 240,27 260,24 280,22 300,20 320,18" 
              stroke="#22c55e" stroke-width="3" fill="none"/>
    
    <!-- Chart Fill -->
    <polygon points="20,70 40,55 60,50 80,45 100,40 120,35 140,38 160,33 180,30 200,28 220,25 240,27 260,24 280,22 300,20 320,18 320,70" 
             fill="url(#chartGradient)"/>
    
    <!-- Chart Points -->
    <circle cx="20" cy="60" r="2" fill="#22c55e"/>
    <circle cx="80" cy="45" r="2" fill="#22c55e"/>
    <circle cx="140" cy="38" r="2" fill="#22c55e"/>
    <circle cx="200" cy="28" r="2" fill="#22c55e"/>
    <circle cx="260" cy="24" r="2" fill="#22c55e"/>
    <circle cx="320" cy="18" r="2" fill="#22c55e"/>
  </g>
  
  <!-- Portfolio Stats -->
  <g transform="translate(50, 270)">
    <text x="0" y="0" fill="white" font-size="12" font-weight="bold">Total Portfolio: $125,430</text>
    <text x="200" y="0" fill="#22c55e" font-size="12" font-weight="bold">24h Change: +$2,340 (+1.9%)</text>
  </g>
  
  <!-- Floating Elements -->
  <g transform="translate(350, 40)">
    <circle cx="0" cy="0" r="20" fill="white" opacity="0.1"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-size="16" font-weight="bold">📊</text>
  </g>
  
  <g transform="translate(20, 200)">
    <circle cx="0" cy="0" r="15" fill="white" opacity="0.1"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">💰</text>
  </g>
  
  <g transform="translate(370, 220)">
    <circle cx="0" cy="0" r="12" fill="white" opacity="0.1"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="10" font-weight="bold">🚀</text>
  </g>
</svg>