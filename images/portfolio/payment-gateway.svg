<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fintechGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="securityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#fintechGradient)" rx="20"/>
  
  <!-- Credit Card -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="120" height="75" fill="url(#cardGradient)" rx="8"/>
    <rect x="10" y="15" width="100" height="8" fill="white" opacity="0.3"/>
    <circle cx="20" cy="35" r="8" fill="white" opacity="0.8"/>
    <circle cx="35" cy="35" r="8" fill="white" opacity="0.6"/>
    <text x="15" y="60" fill="white" font-family="monospace" font-size="10">**** **** **** 1234</text>
  </g>
  
  <!-- Mobile Phone -->
  <g transform="translate(200, 50)">
    <rect x="0" y="0" width="60" height="100" fill="white" opacity="0.9" rx="12"/>
    <rect x="5" y="10" width="50" height="70" fill="#11998e" opacity="0.8" rx="4"/>
    <circle cx="30" cy="90" r="6" fill="#11998e" opacity="0.6"/>
    
    <!-- Payment Interface -->
    <rect x="10" y="20" width="40" height="15" fill="white" opacity="0.8" rx="2"/>
    <rect x="10" y="40" width="40" height="8" fill="white" opacity="0.6" rx="2"/>
    <rect x="10" y="52" width="30" height="8" fill="white" opacity="0.6" rx="2"/>
    <rect x="15" y="65" width="20" height="10" fill="#38ef7d" rx="2"/>
  </g>
  
  <!-- Security Shield -->
  <g transform="translate(300, 70)">
    <path d="M30 10 L50 20 L50 45 Q50 55 30 60 Q10 55 10 45 L10 20 Z" fill="url(#securityGradient)"/>
    <path d="M30 20 L40 25 L40 40 Q40 45 30 48 Q20 45 20 40 L20 25 Z" fill="white" opacity="0.8"/>
    <path d="M25 35 L28 38 L35 30" stroke="#11998e" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Transaction Flow -->
  <g transform="translate(80, 170)">
    <!-- Bank -->
    <rect x="0" y="0" width="50" height="30" fill="white" opacity="0.9" rx="4"/>
    <rect x="5" y="5" width="8" height="20" fill="#11998e" opacity="0.6"/>
    <rect x="15" y="5" width="8" height="20" fill="#11998e" opacity="0.6"/>
    <rect x="25" y="5" width="8" height="20" fill="#11998e" opacity="0.6"/>
    <rect x="35" y="5" width="8" height="20" fill="#11998e" opacity="0.6"/>
    <text x="25" y="40" text-anchor="middle" fill="white" font-size="10">Bank</text>
  </g>
  
  <g transform="translate(170, 170)">
    <!-- Gateway -->
    <circle cx="25" cy="15" r="20" fill="white" opacity="0.9"/>
    <circle cx="25" cy="15" r="12" fill="#11998e" opacity="0.8"/>
    <text x="25" y="19" text-anchor="middle" fill="white" font-size="8" font-weight="bold">API</text>
    <text x="25" y="40" text-anchor="middle" fill="white" font-size="10">Gateway</text>
  </g>
  
  <g transform="translate(260, 170)">
    <!-- Merchant -->
    <rect x="0" y="0" width="50" height="30" fill="white" opacity="0.9" rx="4"/>
    <circle cx="25" cy="15" r="8" fill="#38ef7d"/>
    <text x="25" y="19" text-anchor="middle" fill="white" font-size="10" font-weight="bold">$</text>
    <text x="25" y="40" text-anchor="middle" fill="white" font-size="10">Merchant</text>
  </g>
  
  <!-- Flow Arrows -->
  <path d="M130 185 L170 185" stroke="white" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M220 185 L260 185" stroke="white" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="white"/>
    </marker>
  </defs>
  
  <!-- Analytics Chart -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="100" height="40" fill="white" opacity="0.1" rx="4"/>
    <polyline points="5,30 15,25 25,20 35,15 45,18 55,12 65,8 75,10 85,5 95,7" 
              stroke="#38ef7d" stroke-width="2" fill="none"/>
    <text x="50" y="50" text-anchor="middle" fill="white" font-size="9">Real-time Analytics</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="280" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Payment Gateway</text>
</svg>