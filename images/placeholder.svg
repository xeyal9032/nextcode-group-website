<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- Icon Container -->
  <circle cx="400" cy="250" r="60" fill="url(#iconGradient)" opacity="0.3"/>
  
  <!-- Image Icon -->
  <rect x="360" y="220" width="80" height="60" rx="8" fill="none" stroke="url(#iconGradient)" stroke-width="3"/>
  <circle cx="375" cy="235" r="8" fill="url(#iconGradient)"/>
  <polygon points="360,265 380,245 400,255 440,225 440,280 360,280" fill="url(#iconGradient)" opacity="0.6"/>
  
  <!-- Text -->
  <text x="400" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#4a5568" text-anchor="middle" font-weight="600">Portfolio Projesi</text>
  <text x="400" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#718096" text-anchor="middle">Modern Web Çözümü</text>
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="150" r="3" fill="#667eea" opacity="0.4"/>
  <circle cx="650" cy="150" r="3" fill="#764ba2" opacity="0.4"/>
  <circle cx="150" cy="450" r="3" fill="#764ba2" opacity="0.4"/>
  <circle cx="650" cy="450" r="3" fill="#667eea" opacity="0.4"/>
  
  <!-- Tech Stack Icons -->
  <rect x="300" y="420" width="30" height="30" rx="4" fill="#667eea" opacity="0.2"/>
  <text x="315" y="440" font-family="Arial" font-size="12" fill="#667eea" text-anchor="middle" font-weight="bold">PHP</text>
  
  <rect x="340" y="420" width="30" height="30" rx="4" fill="#764ba2" opacity="0.2"/>
  <text x="355" y="440" font-family="Arial" font-size="12" fill="#764ba2" text-anchor="middle" font-weight="bold">JS</text>
  
  <rect x="380" y="420" width="40" height="30" rx="4" fill="#667eea" opacity="0.2"/>
  <text x="400" y="440" font-family="Arial" font-size="12" fill="#667eea" text-anchor="middle" font-weight="bold">MySQL</text>
  
  <rect x="430" y="420" width="30" height="30" rx="4" fill="#764ba2" opacity="0.2"/>
  <text x="445" y="440" font-family="Arial" font-size="12" fill="#764ba2" text-anchor="middle" font-weight="bold">CSS</text>
  
  <rect x="470" y="420" width="30" height="30" rx="4" fill="#667eea" opacity="0.2"/>
  <text x="485" y="440" font-family="Arial" font-size="12" fill="#667eea" text-anchor="middle" font-weight="bold">API</text>
</svg>