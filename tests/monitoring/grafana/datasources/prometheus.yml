apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      cacheLevel: 'High'
      disableRecordingRules: false
      incrementalQueryOverlapWindow: 10m
      queryTimeout: 60s
      timeInterval: 15s

  - name: MySQL
    type: mysql
    access: proxy
    url: mysql:3306
    database: nextcode_prod
    user: nextcode_user
    secureJsonData:
      password: secure_password_123
    jsonData:
      maxOpenConns: 100
      maxIdleConns: 100
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
      timezone: UTC
      allowCleartextPasswords: false
      serverCert: ""
      clientCert: ""
      clientKey: ""

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "nextcode-logs"
    jsonData:
      esVersion: "8.11.0"
      timeField: "@timestamp"
      logMessageField: "message"
      logLevelField: "level"
      index: "nextcode-logs-*"
      interval: "Daily"
      maxConcurrentShardRequests: 5
      includeFrozen: false
      xpack: false
